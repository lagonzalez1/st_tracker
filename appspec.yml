version: 0.0
os: linux
files:
  - source: /  # All files from the root of the archive
    destination: /home/ubuntu/app  # Copy everything under /home/ubuntu/app
    overwrite: yes
hooks:
  BeforeInstall:
    - location: /home/ubuntu/app/scripts/before_install.sh  # Correct path
      timeout: 600
      runas: root
  AfterInstall:
    - location: /home/ubuntu/app/scripts/after_install.sh
      timeout: 600
      runas: root
  ApplicationStart:
    - location: /home/ubuntu/app/scripts/application_start.sh
      timeout: 600
      runas: root
  ApplicationStop:
    - location: /home/ubuntu/app/scripts/application_stop.sh
      timeout: 600
      runas: root
