version: 0.0
os: linux
files:
  - source: /         # From INSIDE your tar.gz
    destination: /home/ubuntu/app
  - source: /scripts     # From INSIDE your tar.gz
    destination: /home/ubuntu/app/scripts
hooks:
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 600
      runas: root
  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 600
      runas: root
  ApplicationStart:
    - location: scripts/application_start.sh
      timeout: 600
      runas: root
  ApplicationStop:
    - location: scripts/application_stop.sh
      timeout: 600
      runas: root