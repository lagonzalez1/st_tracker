version: 0.0
os: linux
files:
  - source: app
    destination: /home/ubuntu/app
    overwrite: yes
permissions:
  - object: /home/ubuntu/app
    owner: ubuntu
    group: ubuntu
    mode: 755
hooks:
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 600
      runas: root
  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 600
      runas: root
  ApplicationStart:
    - location: scripts/application_start.sh
      timeout: 600
      runas: root
  ApplicationStop:
    - location: scripts/application_stop.sh
      timeout: 600
      runas: root