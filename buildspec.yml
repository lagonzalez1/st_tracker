version: 0.2
phases:
  install:
    runtime-versions:
      golang: 1.21
    commands:
      - echo "Installing dependencies..."
  pre_build:
    commands:
      - go version
  build:
    commands:
      # Run tests (optional)
      # Lint code (optional)            
      # Create deployment package
      - go build -o app tracker/app/main.go
  post_build:
    commands:
      # Package artifacts for CodeDeploy
      - tar -czvf app.tar.gz app
      # Upload to S3 for CodeDeploy
      - aws s3 cp app.tar.gz s3://tracker-backend-deployment-bucket/
artifacts:
  files:
    - app.tar.gz
    - ./appspec.yml
  discard-paths: yes