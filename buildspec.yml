version: 0.2
phases:
  install:
    runtime-versions:
      golang: 1.21
    commands:
      - echo "Verifying Go installation..."
      - go version || { echo "Go installation failed!"; exit 1; }
      - go env
  pre_build:
    commands:
      - echo "Installing dependencies..."
      - go mod download
  build:
    commands:
      - echo "Building binary..."
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o app1 app/main.go
      - sudo chmod +x app1
  post_build:
    commands:
      - echo "Packaging artifacts..."
      - sudo tar --transform='s,^app1$,app,' -czvf app.tar.gz app1
      - aws s3 cp app.tar.gz s3://tracker-backend-deploy/app-$CODEBUILD_BUILD_NUMBER.tar.gz
artifacts:
  files:
    - scripts/**  # Include all files inside scripts/
    - appspec.yml
    - app.tar.gz
  discard-paths: no  # Keep folder structure
