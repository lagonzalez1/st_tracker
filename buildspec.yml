version: 0.2
phases:
  install:
    runtime-versions:
      golang: 1.21
    commands:
      - echo "Verifying Go installation..."
      - go version || { echo "Go installation failed!"; exit 1; }
      - go env
  pre_build:
    commands:
      - echo "Installing dependencies..."
      - go mod download
  build:
    commands:
      - echo "Building binary..."
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o app app/main.go
  post_build:
    commands:
      - echo "Packaging artifacts..."
      # Create structured deployment package
      - mkdir -p deployment
      - mv app deployment/
      - cp -r scripts deployment/
      - cp appspec.yml deployment/
      - tar -czvf app.tar.gz -C deployment .
      - aws s3 cp app.tar.gz s3://tracker-backend-deploy/app-$CODEBUILD_BUILD_NUMBER.tar.gz
artifacts:
  files:
    - app.tar.gz
    - appspec.yml
  discard-paths: yes