version: 0.2
phases:
  install:
    runtime-versions:
      golang: 1.21
    commands:
      - echo "Installing dependencies..."
  pre_build:
    commands:
      - go version
  build:
    commands:
      # Run tests (optional)
      # Lint code (optional)      
      # Build statically linked binary for Linux (without secrets)
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o app
      
      # Create deployment package
      - mkdir -p deployment
      - cp app deployment/
      - cp -r configs deployment/  # Static config files
  post_build:
    commands:
      # Package artifacts for CodeDeploy
      - tar -czvf app.tar.gz -C deployment .
      # Upload to S3 for CodeDeploy
      - aws s3 cp app.tar.gz s3://tracker-backend-deployment-bucket/app.tar.gz
artifacts:
  files:
    - app.tar.gz
    - appspec.yml
  discard-paths: yes