
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3333:3333"
    env_file:
      - .env.development
    depends_on:
      - rabbitmq
      - db
      - valkey
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "set -o allexport && . .env.development && go run app/main.go"
    networks:
      - appnet

  db:
    image: ankane/pgvector
    ports:
      - "2222:5433"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pgpassword
    command: postgres -p 5433
    networks:
      - appnet

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"      # AMQP (for your app)
      - "15672:15672"    # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - appnet
  
  valkey:
    image: valkey/valkey:9.0-alpine3.22
    command: > 
      valkey-server --appendonly yes
                    --save 60 1000
                    --requirepass s3cr3t
                    --maxmemory 512mb
                    --maxmemory-policy allkeys-lru
    volumes:
      - valkey-data:/data
    ports:
      - "6379:6379"
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "s3cr3t", "PING"]
      interval: 10s
      timeout: 3s
      retries: 3
    

networks:
  appnet:
    driver: bridge

volumes:
  valkey-data:
    
  

    