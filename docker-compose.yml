version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3333:3333"
    env_file:
      - .env.development
    depends_on:
      - db
      - rabbitmq
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "set -o allexport && . .env.development && go run app/main.go"

  db:
    image: ankane/pgvector
    ports:
      - "2222:5433"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pgpassword
    command: postgres -p 5433

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"      # AMQP (for your app)
      - "15672:15672"    # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest