
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3333:3333"
    env_file:
      - .env.development
    depends_on:
      - db
      - valkey
      - localstack
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "set -o allexport && . .env.development && go run app/main.go"
    networks:
      - appnet
  
  db:
    image: ankane/pgvector
    ports:
      - "2222:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pgpassword
    networks:
      - appnet
  
  valkey:
    image: valkey/valkey:9.0-alpine3.22
    command: > 
      valkey-server --appendonly yes
                    --save 60 1000
                    --requirepass s3cr3t
                    --maxmemory 512mb
                    --maxmemory-policy allkeys-lru
    volumes:
      - valkey-data:/data
    ports:
      - "6379:6379"
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "s3cr3t", "PING"]
      interval: 10s
      timeout: 3s
      retries: 3
  
  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - DEFAULT_REGION=us-west-1
    volumes:
      - localstack-data:/var/lib/localstack
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  valkey-data:
  localstack-data:
    
  

    